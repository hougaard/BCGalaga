<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Galaga add-in harness</title>
<link rel="stylesheet" href="../../../src/controladdin/galaga/galaga.css">
<style>html, body { height: auto; } #controlAddIn { width: 448px; height: 600px; } body { margin: 0; background: #222; }</style>
</head>
<body>
<div id="controlAddIn"></div>
<pre id="log" style="color:#0f0;font:11px monospace"></pre>
<script>window.onerror = function (m, src, line) { document.getElementById('log').textContent += ' ERROR ' + m + ' ' + src + ':' + line; };</script>
<script src="roms.gen.js"></script>
<script src="machine.gen.js"></script>
<script>
// A mock of the Business Central side: does what page 66700 "Galaga" does, with the translated machine.
(function () {
    var M = createMachine();
    var ROMS = [['.3p', 1, 0], ['.3m', 1, 4096], ['.2m', 1, 8192], ['.2l', 1, 12288], ['.3f', 2, 0], ['.2c', 3, 0],
        ['.4l', 4, 0], ['.4d', 5, 0], ['.4f', 5, 4096], ['.5n', 6, 0], ['.2n', 7, 0], ['.1c', 8, 0], ['.1d', 9, 0]];
    Object.keys(window.ROMS).forEach(function (name) {
        var r = ROMS.find(function (x) { return name.toLowerCase().endsWith(x[0]); });
        if (!r) return;
        var bin = atob(window.ROMS[name]);
        for (var i = 0; i < bin.length; i++) M.LoadRom(r[1], r[2] + i, bin.charCodeAt(i));
    });
    var BOOT = 740, BOOT_BATCH = 30;
    window.harnessLog = [];
    function call(name, args) { setTimeout(function () { window[name].apply(null, args); }, 0); }
    function handle(name, args) {
        if (name === 'ControlReady') {
            M.Initialize();
            M.ResetFrameDelta();
            call('Init', [M.GetPaletteText(), M.GetWaveText()]);
            if (!M.HasColorProms()) call('ShowMessage', ['The color PROMs are missing: the colors are made up.']);
            call('Start', []);
        } else if (name === 'RequestFrames') {
            var input = JSON.parse(args[0]), count = Math.max(1, Math.min(10, args[2]));
            input.forEach(function (e) { M.SetButton(e[1], e[0] === 0); });
            if (input.length) window.harnessLog.push('frame ' + M.GetFrameNo() + ' input ' + args[0]);
            var frames = [];
            if (M.GetFrameNo() < BOOT) {
                var n = Math.min(BOOT_BATCH, BOOT - M.GetFrameNo());
                for (var i = 1; i <= n; i++) M.RunFrame(i === n);
                frames.push(M.GetFrameText());
            } else {
                for (var j = 0; j < count; j++) { M.RunFrame(true); frames.push(M.GetFrameText()); }
            }
            document.getElementById('log').textContent = 'frame ' + M.GetFrameNo() + ' t=' + Math.round(performance.now()) + ' | ' + window.harnessLog.slice(-6).join(' | ');
            // a server round trip of about 40 ms
            setTimeout(function () { window.DrawFrames(frames.join(';'), 5); }, 40);
        }
    }
    window.Microsoft = { Dynamics: { NAV: { InvokeExtensibilityMethod: function (name, args) { setTimeout(function () { handle(name, args); }, 0); } } } };
    // scripted keys: ?keys=time:code+,time:code-  (ms after load)
    var q = new URLSearchParams(location.search).get('keys') || '';
    q.split(',').filter(Boolean).forEach(function (k) {
        var m = /^(\d+):(\w+)([+-])$/.exec(k);
        setTimeout(function () {
            var c = document.getElementById('galagaCanvas');
            c.dispatchEvent(new KeyboardEvent(m[3] === '+' ? 'keydown' : 'keyup', { code: m[2], bubbles: true }));
        }, +m[1]);
    });
})();
</script>
<script src="../../../src/controladdin/galaga/screen.js"></script>
<script src="../../../src/controladdin/galaga/galaga.js"></script>
</body>
</html>
